
name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag (for example v1.2.3; use a new tag for each release)"
        required: true
        type: string

env:
  IMAGE_TAG: ${{ inputs.image_tag }}

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Validate image tag
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ || "${IMAGE_TAG,,}" == "latest" ]]; then
            echo "::error::Enter a valid Docker tag other than latest (for example v1.2.3)."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, intl, zip, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test --compact

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      # 1. Preuzimanje koda iz GitHub repozitorijuma
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prijava na Docker Hub koristeći Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Automatski Build i Push za PHP-FPM sliku
      - name: Build and Push PHP-FPM Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: true
          tags: sinisaglavas/voltio-php-fpm:${{ env.IMAGE_TAG }}

      # 4. Automatski Build i Push za Web/Nginx sliku
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: true
          tags: sinisaglavas/voltio-web:${{ env.IMAGE_TAG }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Checkout deployment configuration
        uses: actions/checkout@v4

      - name: Deploy application on VM
        shell: bash
        run: |
          cp "$GITHUB_WORKSPACE/compose.deploy.yaml" /home/devops/eCommerce/compose.deploy.yaml
          cd /home/devops/eCommerce
          docker compose -f compose.deploy.yaml pull
          docker compose -f compose.deploy.yaml up -d --remove-orphans
          docker compose -f compose.deploy.yaml exec -T php-fpm php artisan optimize:clear
          docker compose -f compose.deploy.yaml exec -T php-fpm php artisan view:clear
          docker compose -f compose.deploy.yaml ps
