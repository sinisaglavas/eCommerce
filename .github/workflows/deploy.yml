
name: CI/CD Pipeline

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, intl, zip, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Prepare environment
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate application key
        run: php artisan key:generate --no-interaction

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Run tests
        run: php artisan test --compact

  build-and-push:
    needs: tests
    runs-on: ubuntu-latest

    steps:
      # 1. Preuzimanje koda iz GitHub repozitorijuma
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prijava na Docker Hub koristeći Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Automatski Build i Push za PHP-FPM sliku
      - name: Build and Push PHP-FPM Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/common/php-fpm/Dockerfile
          target: production
          push: true
          tags: sinisaglavas/voltio-php-fpm:latest

      # 4. Automatski Build i Push za Web/Nginx sliku
      - name: Build and Push Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/production/nginx/Dockerfile
          push: true
          tags: sinisaglavas/voltio-web:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy application on VM
        run: |
          cd /home/devops/eCommerce
          docker compose -f compose.deploy.yaml pull
          docker compose -f compose.deploy.yaml up -d --remove-orphans
          docker compose -f compose.deploy.yaml exec -T php-fpm php artisan optimize:clear
          docker compose -f compose.deploy.yaml exec -T php-fpm php artisan view:clear
          docker compose -f compose.deploy.yaml ps
